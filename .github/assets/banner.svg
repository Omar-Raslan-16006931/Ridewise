<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/><stop offset="50%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <style>
      .t{font:800 64px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#fff}
      .d{font:500 22px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#fff;opacity:.92}
      .w1{animation:m 9s ease-in-out infinite alternate} .w2{animation:m 12s ease-in-out infinite alternate-reverse}
      @keyframes f{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
      @keyframes m{from{transform:translateX(0)}to{transform:translateX(-120px)}}
    </style>
  </defs>
  <rect width="1200" height="220" fill="url(#g)"/>
  <path class="w1" fill="#ffffff" fill-opacity=".10" d="M0 150 C200 100 400 200 600 150 S1000 100 1320 160 V220 H0Z"/>
  <path class="w2" fill="#ffffff" fill-opacity=".14" d="M0 180 C250 130 450 220 700 175 S1100 140 1320 185 V220 H0Z"/>
  <text class="t" x="600" y="101" text-anchor="middle">Ridewise</text>
  <text class="d" x="600" y="145" text-anchor="middle">Shared Uber ledger with budgeting and spending analytics</text>
</svg>
